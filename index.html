const initial=()=>({mode:'random',view:'home',roster:[],draw:null,results:[],myPlayer:null,season:2026,round:0,settings:{speed:'normal'},last:null,recordTab:'bat',resultTab:'bat'});
let state;try{state={...initial(),...JSON.parse(localStorage.getItem('fullcount-offline-2000-v1')||'{}')}}catch(e){state=initial()};
function refreshSavedPositions(){
  const fix=p=>{if(!p||p.role!=='BAT')return;let raw=REAL_DATA[`${p.year}|${p.team}`];if(!raw)return;let match=raw.split(';').find(x=>x.split(',')[0]===p.name);if(!match)return;let newPos=match.split(',')[2];if(newPos&&p.pos!==newPos)p.pos=newPos;};
  (state.roster||[]).forEach(fix);(state.draw?.players||[]).forEach(fix);
}
refreshSavedPositions();
function save(){localStorage.setItem('fullcount-offline-2000-v1',JSON.stringify(state))}
function go(view){state.view=view;save();render();window.scrollTo(0,0)}
function setMode(m){state.mode=m;save();if(m==='random'){state.draw=null;go('draw');}else if(m==='dream')go('dream');else go('myplayer')}
function rosterAdd(p,slot){if(state.roster.some(x=>samePerson(x,p))){alert('다른 연도라도 이미 영입한 선수는 다시 영입할 수 없어.');return false}if(state.roster.length>=20){alert('20명 구성이 완료됐어.');return false}let choices=canPick(p);slot=slot||choices[0];if(!choices.includes(slot)){alert('해당 포지션은 이미 정원이 찼거나 선택할 수 없어.');return false}state.roster.push({...p,draftSlot:slot});save();render();return true}
function nextSlot(){return remaining()[0]||null}
function eligible(p,slot){return canPick(p).includes(slot)}
function removePlayer(id){alert("한 번 영입한 선수는 변경하거나 제외할 수 없어.");}
function draw(){if(state.draw){go('draft');return}go('draw')}
function draft(id,slot){if(rolling||!state.draw)return;let p=state.draw.players.find(x=>x.id===id);if(!p)return;if(rosterAdd(p,slot)){state.draw=null;save();if(state.roster.length<20)go('draw');else go('lineup')}}
function reset(){if(!confirm('저장된 선수와 경기 기록을 모두 초기화할까?'))return;state=initial();save();go('home')}
function demoTeam(){state.roster=[];for(let slot of SLOT_ORDER){let p=Object.keys(REAL_DATA).flatMap(k=>{let [y,t]=k.split('|');return makePlayers(+y,t)}).filter(p=>eligible(p,slot)&&!state.roster.some(x=>samePerson(x,p))).sort((a,b)=>b.ovr-a.ovr)[0];if(p)state.roster.push({...p,draftSlot:slot})}save();go('lineup')}
function teamStrength(){
 const hitters=state.roster.filter(p=>POS.includes(p.draftSlot));const sp=state.roster.filter(p=>p.draftSlot==='SP');const rp=state.roster.filter(p=>p.draftSlot==='RP');const cp=state.roster.filter(p=>p.draftSlot==='CP');
 const mean=a=>a.length?a.reduce((v,p)=>v+p.ovr,0)/a.length:75;
 return .43*mean(hitters)+.38*mean(sp)+.13*mean(rp)+.06*mean(cp);
}
function randNormal(){return (Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3)*1.41421356;}
function poissonRuns(mu){ // bounded, baseball-like game scoring; unlike the old nine-inning Bernoulli cap
 let l=Math.exp(-mu),k=0,p=1;do{k++;p*=Math.random()}while(p>l&&k<30);return Math.max(0,k-1);
}
function teamUnits(){
 const bats=state.roster.filter(p=>POS.includes(p.draftSlot)),sp=state.roster.filter(p=>p.draftSlot==='SP'),rp=state.roster.filter(p=>p.draftSlot==='RP'),cp=state.roster.filter(p=>p.draftSlot==='CP');
 const avg=(xs)=>xs.length?xs.reduce((a,p)=>a+p.ovr,0)/xs.length:76;
 return {off:avg(bats),sp:avg(sp),rp:avg(rp),cp:avg(cp)};
}
function gameRuns(attack,defense){
 // The roster is an all-star draft: a 90 OVR rotation must suppress runs significantly.
 const mu=Math.max(2.1,Math.min(7.2,4.45+(attack-89)*.075-(defense-89)*.085));
 return poissonRuns(mu);
}
function simulateOne(forcedOpponent){
 if(state.roster.length<20){alert('20인 로스터를 먼저 완성해줘.');return}
 const batters=state.roster.filter(p=>POS.includes(p.draftSlot));
 const starters=state.roster.filter(p=>p.draftSlot==='SP'), relievers=state.roster.filter(p=>p.draftSlot==='RP'),closers=state.roster.filter(p=>p.draftSlot==='CP');
 const opp=forcedOpponent||TEAMS[Math.floor(Math.random()*TEAMS.length)];
 const gameIndex=state.results.length;const starter=starters[gameIndex%5];
 const u=teamUnits(),opStrength=TEAM_POWER[opp]||91;
 // Pitching is split by workload: starter ~6 innings, bullpen ~2, closer ~1.
 const starterQuality=starter?.ovr||u.sp;
 const ourPitch=.67*starterQuality+.23*u.rp+.10*u.cp;
 const away=gameRuns(u.off,opStrength),home=gameRuns(opStrength,ourPitch);
 const chance=p=>Math.random()<p;
 const bat=batters.map(p=>{
  const st=p.batProfile,weight=st?Math.min(.9,st[1]/(st[1]+200)):.4;
  const ba=st?(st[3]/Math.max(1,st[2]))*weight+.265*(1-weight):Math.max(.205,Math.min(.335,.265+(p.contact-75)*.002));
  const hrRate=st?(st[4]/Math.max(1,st[2]))*weight+.025*(1-weight):Math.max(.005,Math.min(.085,.025+(p.power-75)*.001));
  const ab=3+Math.floor(Math.random()*3);let h=0,hr=0;
  for(let i=0;i<ab;i++)if(chance(ba)){h++;if(chance(Math.min(.38,hrRate/Math.max(.01,ba))))hr++}
  const bb=chance(.32)?1:0,rbi=0;
  return {...p,ab,h,hr,rbi,r:chance(Math.min(.65,(h+bb)*.21))?1:0,bb};
 });
 // Attribute team runs to batters, so cumulative RBI agrees with the scoreboard.
 // Some runs are scored on errors, wild pitches, double plays etc. and carry no RBI.
 const rbiRuns=Math.max(0,away-(away>0&&Math.random()<.12?1:0));
 const weightsRBI=bat.map(p=>Math.max(.04,p.h*.85+p.hr*2.7+p.bb*.13+(p.ab>=4?.10:0)));
 for(let n=0;n<rbiRuns;n++){
   const total=weightsRBI.reduce((a,b)=>a+b,0);let pick=Math.random()*total;
   for(let j=0;j<bat.length;j++){pick-=weightsRBI[j];if(pick<=0||j===bat.length-1){bat[j].rbi++;break}}
 }
 // Each run is scored by one batter; assign runs consistently with the team total.
 for(const p of bat)p.r=0;
 const runWeights=bat.map(p=>Math.max(.03,p.h+p.bb*.7+p.hr*.8));
 for(let n=0;n<away;n++){
   let pick=Math.random()*runWeights.reduce((a,b)=>a+b,0);
   for(let j=0;j<bat.length;j++){pick-=runWeights[j];if(pick<=0||j===bat.length-1){bat[j].r++;break}}
 }
 const inningA=Array(9).fill(0),inningB=Array(9).fill(0);
 for(let k=0;k<away;k++)inningA[Math.floor(Math.random()*9)]++;
 for(let k=0;k<home;k++)inningB[Math.floor(Math.random()*9)]++;
 // Allocate exactly nine innings across pitchers. A closer enters only for a save situation.
 const saveSituation=away>home&&away-home<=3;
 const cp=closers[0],useCloser=!!(cp&&saveSituation);
 const spIP=5+Math.floor(Math.random()*3),cpIP=useCloser?1:0,rpIP=9-spIP-cpIP;
 const rp=relievers[gameIndex%relievers.length];
 const pstats=[];
 // Earned runs are allocated by innings AND quality; avoid assigning every bullpen run
 // to one reliever, which previously inflated RP ERAs regardless of OVR.
 const slots=[{p:starter,role:'SP',ip:spIP},{p:rp,role:'RP',ip:rpIP}];
 if(useCloser)slots.push({p:cp,role:'CP',ip:cpIP});
 const weights=slots.map(x=>x.ip*Math.max(.35,Math.min(2.2,Math.exp((79-(x.p?.ovr||79))*.045))));
 const earned=Math.max(0,home-(Math.random()<.18?1:0));
 const ers=slots.map(()=>0);
 for(let i=0;i<earned;i++){let pick=Math.random()*weights.reduce((a,b)=>a+b,0);for(let j=0;j<weights.length;j++){pick-=weights[j];if(pick<=0||j===weights.length-1){ers[j]++;break}}}
 slots.forEach((x,j)=>{if(!x.p||x.ip<=0)return;const so=Math.max(0,Math.round(x.ip*(.67+(x.p.ovr-78)*.022)+randNormal()*.9));
 pstats.push({id:x.p.id,name:x.p.name,role:x.role,ip:x.ip,er:ers[j],so,bb:Math.max(0,Math.round(x.ip*(.34-(x.p.ovr-78)*.009)+randNormal()*.6)),w:x.role==='SP'&&away>home?1:0,l:x.role==='SP'&&away<home?1:0,sv:x.role==='CP'&&useCloser?1:0,hld:x.role==='RP'&&useCloser&&away>home?1:0});
 });
 const result={id:Date.now()+gameIndex,opponent:opp,our:away,their:home,bat,pitcher:pstats[0]||null,pitchers:pstats,inningA,inningB,mvp:bat.slice().sort((a,b)=>(b.h*2+b.hr*2+b.rbi)-(a.h*2+a.hr*2+a.rbi))[0].name};
 state.results.push(result);state.last=result;
}
const TEAM_POWER={'KIA 타이거즈':92,'LG 트윈스':93,'삼성 라이온즈':92,'한화 이글스':93,'롯데 자이언츠':91,'두산 베어스':92,'SSG 랜더스':92,'KT 위즈':92,'NC 다이노스':91,'키움 히어로즈':91};
function startSim(){
 if(state.roster.length<20){alert('20인 로스터를 먼저 완성해줘.');return}
 const left=Math.max(0,144-state.results.length);if(!left){go('records');return}
 // 9 rivals x 16 games = 144; existing games count toward each matchup.
 const counts=Object.fromEntries(TEAMS.map(t=>[t,0]));for(const r of state.results)if(counts[r.opponent]!==undefined)counts[r.opponent]++;
 for(let i=0;i<left;i++){let pool=TEAMS.filter(t=>counts[t]<16);if(!pool.length)pool=TEAMS;const opp=pool[Math.floor(Math.random()*pool.length)];simulateOne(opp);counts[opp]++}
 save();go('records');
}

function result(){let r=state.last||state.results.at(-1);if(!r)return pageHead('MATCH RESULT','경기 결과','아직 진행한 경기가 없어.')+`<button class="btn" onclick="go('lineup')">라인업으로</button>`;return pageHead('MATCH RESULT','경기 결과','실시간 경기 화면 없이 최종 점수와 선수별 기록을 확인해.')+`<div class="card"><div class="tag" style="text-align:center">FINAL SCORE</div><div class="score"><span>MY TEAM</span><b>${r.our} : ${r.their}</b><span>${r.opponent}</span></div><div class="inning">${r.our>r.their?'VICTORY':r.our===r.their?'DRAW':'DEFEAT'} · MVP ${r.mvp}</div><div class="tablewrap" style="margin-top:23px"><table><thead><tr><th>팀</th>${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')}<th>합계</th></tr></thead><tbody><tr><td>MY TEAM</td>${r.inningA.map(x=>`<td>${x}</td>`).join('')}<td><b>${r.our}</b></td></tr><tr><td>${r.opponent}</td>${r.inningB.map(x=>`<td>${x}</td>`).join('')}<td><b>${r.their}</b></td></tr></tbody></table></div></div><div class="section card"><div class="tabs"><button class="${state.resultTab==='bat'?'active':''}" onclick="state.resultTab='bat';render()">타자 기록</button><button class="${state.resultTab==='pitch'?'active':''}" onclick="state.resultTab='pitch';render()">투수 기록</button></div>${state.resultTab==='bat'?`<div class="tablewrap"><table><thead><tr><th>선수</th><th>포지션</th><th>타수</th><th>안타</th><th>홈런</th><th>타점</th><th>득점</th><th>볼넷</th></tr></thead><tbody>${r.bat.map(p=>`<tr><td>${p.name}</td><td>${p.pos}</td><td>${p.ab}</td><td>${p.h}</td><td>${p.hr}</td><td>${p.rbi}</td><td>${p.r}</td><td>${p.bb}</td></tr>`).join('')}</tbody></table></div>`:`<div class="tablewrap"><table><thead><tr><th>투수</th><th>이닝</th><th>자책점</th><th>삼진</th><th>볼넷</th></tr></thead><tbody><tr><td>${r.pitcher.name}</td><td>${r.pitcher.ip}</td><td>${r.pitcher.er}</td><td>${r.pitcher.so}</td><td>${r.pitcher.bb}</td></tr></tbody></table></div>`}<div class="row" style="margin-top:20px"><button class="btn" onclick="go('records')">시즌 결과 보기</button><button class="btn secondary" onclick="go('records')">시즌 전체 기록 →</button></div></div>`}
// Ten-team league: each team plays 144 games; all games in standings are accounted for.
function leagueStandings(){
 const names=['MY TEAM',...TEAMS],table=Object.fromEntries(names.map(team=>[team,{team,w:0,l:0,d:0,rf:0,ra:0,g:0}]));
 function add(a,b,as,bs){const x=table[a],y=table[b];if(!x||!y||a===b)return;x.g++;y.g++;x.rf+=as;x.ra+=bs;y.rf+=bs;y.ra+=as;if(as>bs){x.w++;y.l++}else if(as<bs){x.l++;y.w++}else{x.d++;y.d++}}
 for(const r of state.results)if(table[r.opponent])add('MY TEAM',r.opponent,r.our,r.their);
 // Build rival-vs-rival fixtures so each club has 16 games against each other club.
 // Historic saves may contain unbalanced opponent counts; account for these first.
 let seed=2166136261;for(const r of state.results){seed^=r.our*31+r.their*17+r.opponent.length;seed=Math.imul(seed,16777619)}
 const random=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
 const rivals=TEAMS;
 const remaining=Object.fromEntries(rivals.map(t=>[t,Math.max(0,144-table[t].g)]));
 // Rival-vs-rival target is 16 fixtures per pair; allows each team 144 games in completed season.
 const fixtures=[];for(let i=0;i<rivals.length;i++)for(let j=i+1;j<rivals.length;j++)for(let k=0;k<16;k++)fixtures.push([rivals[i],rivals[j]]);
 // Pick fixtures to satisfy missing game totals; game ordering shuffled deterministically.
 for(let i=fixtures.length-1;i>0;i--){let j=Math.floor(random()*(i+1));[fixtures[i],fixtures[j]]=[fixtures[j],fixtures[i]]}
 for(const [a,b] of fixtures){if(remaining[a]<=0||remaining[b]<=0)continue;const meanA=Math.max(2.1,Math.min(7.2,4.45+((TEAM_POWER[a]||90)-89)*.075-((TEAM_POWER[b]||90)-89)*.085));
 const meanB=Math.max(2.1,Math.min(7.2,4.45+((TEAM_POWER[b]||90)-89)*.075-((TEAM_POWER[a]||90)-89)*.085));
 const sample=mu=>{let p=1,k=0,limit=Math.exp(-mu);do{k++;p*=Math.max(1e-9,random())}while(p>limit&&k<30);return k-1};
 const as=sample(meanA),bs=sample(meanB);add(a,b,as,bs);remaining[a]--;remaining[b]--}
 // If a historical save has irregular schedules, fill remaining rival games against other available rivals.
 let guard=0;while(guard++<2000){const open=rivals.filter(t=>remaining[t]>0).sort((a,b)=>remaining[b]-remaining[a]);if(open.length<2)break;const a=open[0],b=open[1];add(a,b,Math.floor(random()*8),Math.floor(random()*8));remaining[a]--;remaining[b]--}
 const standings=Object.values(table).map(x=>({...x,pct:(x.w+x.l)?x.w/(x.w+x.l):0})).sort((a,b)=>b.pct-a.pct||b.w-a.w||(b.rf-b.ra)-(a.rf-a.ra));
 const leader=standings[0];for(const x of standings){x.gb=x.team===leader.team?0:((leader.w-x.w)+(x.l-leader.l))/2}
 return standings;
}
function postseasonResult(league){
 if(state.results.length<144)return null;
 // Consistent per-season result, determined by final roster/standings; not rerolled on page refresh.
 const rank=league.findIndex(x=>x.team==='MY TEAM')+1;
 if(rank>5)return {rank,regular:rank===1,champion:false,detail:'포스트시즌 진출 실패'};
 let seed=state.results.reduce((v,r)=>(Math.imul(v^((r.our+1)*37+(r.their+1)*17),16777619)>>>0),2166136261);
 function random(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296}
 const strength=teamStrength();let survived=true;
 // Higher regular-season seed enters later; 1st place enters directly into Korean Series.
 const rounds=rank===1?['한국시리즈']:rank===2?['플레이오프','한국시리즈']:rank===3?['준플레이오프','플레이오프','한국시리즈']:['와일드카드','준플레이오프','플레이오프','한국시리즈'];
 let detail='';for(const round of rounds){const chance=Math.max(.25,Math.min(.78,.49+(strength-90)*.018+(rank===1?.08:0)));if(random()>chance){survived=false;detail=round+' 탈락';break}}
 return {rank,regular:rank===1,champion:survived,detail:survived?'한국시리즈 우승':detail};
}
function records(){
 const rs=state.results,w=rs.filter(r=>r.our>r.their).length,l=rs.filter(r=>r.our<r.their).length,d=rs.length-w-l;
 const avg=(w+l)?(w/(w+l)).toFixed(3):'.000',sc=rs.reduce((s,r)=>s+r.our,0),al=rs.reduce((s,r)=>s+r.their,0);
 const map={},pmap={};for(const r of rs){for(const p of r.bat){const a=map[p.id]||{name:p.name,pos:p.pos,g:0,ab:0,h:0,hr:0,rbi:0,bb:0};a.g++;a.ab+=p.ab;a.h+=p.h;a.hr+=p.hr;a.rbi+=p.rbi;a.bb+=p.bb;map[p.id]=a}
 for(const p of (r.pitchers||[r.pitcher].filter(Boolean))){const a=pmap[p.id]||{name:p.name,role:p.role||'SP',g:0,ip:0,er:0,so:0,bb:0,w:0,l:0,sv:0,hld:0};a.g++;for(const k of ['ip','er','so','bb','w','l','sv','hld'])a[k]+=p[k]||0;pmap[p.id]=a}}
 const stats=Object.values(map).sort((a,b)=>b.h-a.h),pstats=Object.values(pmap).sort((a,b)=>b.ip-a.ip);
 const league=leagueStandings(),myRank=league.findIndex(t=>t.team==='MY TEAM')+1,post=postseasonResult(league);
 const regular=post?(post.regular?'🏆 정규시즌 우승':'정규시즌 우승 실패'):'144경기 완료 후 결정';
 const ks=post?(post.champion?'🏆 한국시리즈 우승':'한국시리즈 우승 실패'):'144경기 완료 후 결정';
 return pageHead('SEASON STATS',`${state.season} 시즌 기록실`,'144경기 결과 · 10개 구단 순위 · 타자/투수 누적 기록')+
 `<div class="statgrid"><div class="stat">팀 순위<strong>${rs.length?myRank+'위':'—'}</strong><small>10개 구단</small></div><div class="stat">팀 전적<strong>${w}승 ${l}패</strong><small>${d}무</small></div><div class="stat">승률<strong>${avg}</strong></div><div class="stat">팀 득점<strong>${sc}</strong></div><div class="stat">팀 실점<strong>${al}</strong></div></div>`+
 `<div class="section card"><h3>🏅 최종 시즌 성적</h3><div class="row" style="gap:12px;flex-wrap:wrap"><span class="badge">${regular}</span><span class="badge">${ks}</span>${post?`<span class="badge">${post.detail}</span>`:''}</div><p class="muted">정규시즌 우승은 144경기 리그 1위로 결정돼. 한국시리즈는 상위 5팀 진출 여부, 정규시즌 순위와 우리 팀 평균 OVR을 반영한 확률 판정이야. 실제 KBO 경기별 포스트시즌 진행과는 달라.</p></div>`+
 `<div class="section card"><h3>🏆 리그 순위표 <span class="pill">${rs.length}/144경기</span></h3><p class="muted">가상 10개 구단 리그 · 경기차(GB)는 1위 기준 · 승률은 무승부 제외</p><div class="tablewrap"><table><thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>패</th><th>무</th><th>승률</th><th>경기차</th><th>득실차</th></tr></thead><tbody>${league.map((t,i)=>`<tr style="${t.team==='MY TEAM'?'background:rgba(52,211,153,.12);font-weight:700':''}"><td>${i+1}</td><td>${t.team==='MY TEAM'?'⭐ MY TEAM':escapeHTML(t.team)}</td><td>${t.g}</td><td>${t.w}</td><td>${t.l}</td><td>${t.d}</td><td>${t.pct.toFixed(3)}</td><td>${t.gb===0?'—':t.gb.toFixed(1)}</td><td>${t.rf-t.ra>0?'+':''}${t.rf-t.ra}</td></tr>`).join('')}</tbody></table></div></div>`+
 `<div class="section card"><div class="tabs"><button class="${state.recordTab==='bat'?'active':''}" onclick="state.recordTab='bat';render()">타자 누적 기록</button><button class="${state.recordTab==='pitch'?'active':''}" onclick="state.recordTab='pitch';render()">투수 누적 기록</button></div>${state.recordTab==='pitch'?`<div class="tablewrap"><table><thead><tr><th>투수</th><th>역할</th><th>등판</th><th>이닝</th><th>승</th><th>패</th><th>홀드</th><th>세이브</th><th>삼진</th><th>볼넷</th><th>ERA</th></tr></thead><tbody>${pstats.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${p.role}</td><td>${p.g}</td><td>${p.ip}</td><td>${p.w}</td><td>${p.l}</td><td>${p.hld}</td><td>${p.sv}</td><td>${p.so}</td><td>${p.bb}</td><td>${p.ip?(p.er*9/p.ip).toFixed(2):'—'}</td></tr>`).join('')||'<tr><td colspan="11">투수 기록 없음</td></tr>'}</tbody></table></div>`:`<div class="tablewrap"><table><thead><tr><th>타자</th><th>경기</th><th>타수</th><th>안타</th><th>타율</th><th>홈런</th><th>타점</th></tr></thead><tbody>${stats.map(p=>`<tr><td>${escapeHTML(p.name)}</td><td>${p.g}</td><td>${p.ab}</td><td>${p.h}</td><td>${p.ab?(p.h/p.ab).toFixed(3):'.000'}</td><td>${p.hr}</td><td>${p.rbi}</td></tr>`).join('')||'<tr><td colspan="7">타자 기록 없음</td></tr>'}</tbody></table></div>`}</div>`+
 `<div class="section card"><h3>경기 내역</h3><div class="tablewrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>경기</th><th>상대</th><th>결과</th></tr></thead><tbody>${rs.slice().reverse().map((r,i)=>`<tr><td>${rs.length-i}</td><td>${escapeHTML(r.opponent)}</td><td>${r.our>r.their?'승':r.our===r.their?'무':'패'} ${r.our}:${r.their}</td></tr>`).join('')||'<tr><td colspan="3">기록 없음</td></tr>'}</tbody></table></div><div class="row" style="margin-top:18px"><button class="btn secondary" onclick="go('lineup')">라인업 보기</button><button class="btn" onclick="replaySeason()">↻ 다시하기 · 새 드래프트</button></div></div>`+
 `<p class="notice">※ v29부터 상대 구단 전력이 강화되고 팀 득점과 타점·득점 합계가 연결됐어. 높은 OVR의 투수진은 실점 억제 효과가 적용되고, 자책점은 투구 이닝과 투수별 능력치에 따라 분배돼. 기존 저장 경기는 다시하기로 새 시즌을 시작해야 반영돼. 타 구단과 포스트시즌은 게임용 가상 시뮬레이션이야. 기존 저장 경기의 투수 세부 기록은 당시 저장된 범위만 표시돼. 새 시즌을 시작하면 새 규칙이 적용돼.</p>`;
}
function settings(){return pageHead('OPTIONS','설정','데모 진행 및 저장 데이터를 관리해.')+`<div class="card" style="max-width:650px"><h3>역대 선수 데이터 추가 (CSV)</h3><p class="muted">2000~2025년 선수 기록이 이미 내장돼 있어. 추가 CSV를 불러올 수도 있어. 열 이름: <b>year,team,name,role,pos,ovr</b>. role은 SP/RP/CP/BAT, pos는 C/1B/2B/3B/SS/LF/CF/RF/DH를 사용해.</p><input type="file" accept=".csv,text/csv" onchange="importCSVFile(this)"><p class="notice">현재 등록: ${Object.keys(REAL_DATA).length}개 시즌·구단 / ${dataCount()}개 항목. 파일은 이 브라우저에 저장돼. 2000~2025년 기준 충족 선수 내장. 2026년은 아직 미포함.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>로컬 저장</h3><p class="muted">현재 브라우저에 선수 명단과 경기 결과가 자동 저장돼. 서버 계정 연동은 아직 없어.</p><button class="btn warn" onclick="reset()">모든 데이터 초기화</button><div class="notice">브라우저의 저장 데이터를 삭제하면 복구할 수 없어.</div></div>`}
